name: Daily dinner suggestion

on:
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily suggestion endpoint
        env:
          DAILY_TASK_URL: ${{ secrets.DAILY_TASK_URL }}
          TASK_SECRET: ${{ secrets.TASK_SECRET }}
        run: |
          curl --fail --show-error --silent \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 180 \
            --request POST \
            --header "Authorization: Bearer ${TASK_SECRET}" \
            "${DAILY_TASK_URL}"
